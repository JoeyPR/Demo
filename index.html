<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You and me — planner</title>
<link rel="icon" href="img/icon-96.png">
<meta name="theme-color" content="#1b1b1b">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/wrap.css">
<link rel="stylesheet" href="css/preview.css">
<link rel="stylesheet" href="css/pads.css">
<link rel="stylesheet" href="css/inv.css">
<link rel="stylesheet" href="css/drop.css">
<link rel="stylesheet" href="css/dropdowns.css">
<link rel="stylesheet" href="css/systems.css">
<link rel="stylesheet" href="css/customization.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/blackbox.css">
</head>
<body>
<div id="wrap"></div>
<img id="logo" src="img/logo.png" alt="GrowTool" draggable="false">
<div id="preview">
  <canvas id="pv" width="1920" height="1080"></canvas>
</div>
<div id="hud"></div>

<main id="ui">

  <!-- 1. ACTION PADS -->
  <nav id="pads">
    <button class="pad" id="pad-left"  data-k="left"  aria-label="Left"><img src="img/pad-left.png"  alt="" draggable="false"></button>
    <button class="pad" id="pad-right" data-k="right" aria-label="Right"><img src="img/pad-right.png" alt="" draggable="false"></button>
    <button class="pad" id="pad-jump"  data-k="jump"  aria-label="Jump"><img src="img/pad-jump.png"  alt="" draggable="false"></button>
    <button class="pad" id="pad-punch" data-k="punch" aria-label="Punch"><img src="img/pad-punch.png" alt="" draggable="false"></button>
  </nav>

  <section id="inv">

    <!-- 4. TOP DRAWER: handle + 4 quick boxes -->
    <div id="top" class="panel">
      <div id="quick"></div>
      <div id="handle" role="slider" aria-label="Drag inventory up or down" tabindex="0">
      <img class="hm" src="img/handle-m.png"  alt="" draggable="false">
      <img class="hd hd-n" src="img/handle-d.png"  alt="" draggable="false">
      <img class="hd hd-u" src="img/handle-du.png" alt="" draggable="false">
      <img class="hd hd-d" src="img/handle-dd.png" alt="" draggable="false">
      </div>
    </div>

    <!-- 3. TABS -->
    <div id="tabs" role="tablist"></div>

    <!-- 1. MAIN DRAWER -->
    <div id="main" class="panel">
      <img id="s-icon" src="img/search.png" alt="" draggable="false">
      <input id="q" type="text" placeholder="Enter Item Name" autocomplete="off" spellcheck="false" aria-label="Search items">
      <button id="filter-button" type="button" aria-label="Filter clothing categories" aria-expanded="false" aria-controls="filter-panel" title="Filter clothing categories"><span aria-hidden="true"></span></button>
      <div id="filter-panel" hidden aria-label="Clothing categories"></div>
      <div id="custom-tools" hidden aria-live="polite"></div>
      <div id="grid"></div>
    </div>

    <!-- 2. SIDE PANEL -->
    <aside id="side" class="panel">
      <div id="back"><button id="sw" role="switch" aria-checked="false" aria-label="Search on/off"><img class="off" src="img/sw-off.png" alt="" draggable="false"><img class="on" src="img/sw-on.png" alt="" draggable="false"></button></div>
      <button class="sbtn" data-a="store">STORE</button>
      <button class="sbtn" data-a="drop">DROP</button>
      <button class="sbtn" data-a="info">INFO</button>
      <button class="sbtn" data-a="fav">FAV</button>
      <button class="sbtn" data-a="wrench">WRENCH</button>
      <button class="sbtn" data-a="export">EXPORT</button>
    </aside>

  </section>
</main>

<div id="toast" role="status"></div>
<div id="blackbox" class="blackbox" role="status" aria-live="polite" hidden></div>
<!-- load order matters: core -> slots stub -> systems -> app boot -->
<script src="js/core.js"></script>
<script>
/* slot names for the tab categories before the catalog loads */
P.dat = { slots: {"0":"Hat","1":"Shirt","2":"Pants","3":"Feet","4":"Face","5":"Hand","6":"Back","7":"Hair","8":"Chest","9":"Ancestral"} };
</script>
<script src="js/pads.js"></script>
<script src="js/tabs.js"></script>
<script src="js/rtfont.js"></script>
<script src="js/plate.js"></script>
<script src="js/grid.js"></script>
<script src="js/blackbox.js"></script>
<script src="js/side.js"></script>
<script src="js/drop.js"></script>
<script src="js/weather.js"></script>
<script src="js/land.js"></script>
<script src="js/customization.js"></script>
<script src="js/wrench-ui.js"></script>
<script src="js/handle.js"></script>
<script src="js/preview.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
