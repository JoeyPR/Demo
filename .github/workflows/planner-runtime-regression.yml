name: Planner runtime regression
on:
  push:
    branches: [camera-quickslot-nameplate]
    paths:
      - 'font/**'
      - 'css/base.css'
      - 'js/preview-mode.js'
      - 'js/player-shadow.mjs'
      - 'js/pads.js'
      - 'css/preview-mode.css'
      - 'src/**'
      - 'demo/engine/**'
      - 'js/player-chat.js'
      - 'js/world-motion.mjs'
      - 'js/skin-colors*'
      - 'js/item-info.js'
      - 'js/customization.js'
      - 'css/player-chat.css'
      - 'css/customization.css'
      - 'css/item-info.css'
      - 'data/item-info.json'
      - 'test/**'
      - 'js/core.js'
      - 'js/tabs.js'
      - 'js/grid.js'
      - 'js/app.js'
      - 'js/drop.js'
      - 'js/weather.js'
      - 'js/background.js'
      - 'js/land.js'
      - 'js/land-system.mjs'
      - 'js/blackbox.js'
      - 'js/drop-world.mjs'
      - 'css/blackbox.css'
      - 'css/dropdowns.css'
      - 'index.html'
      - 'data/blocks.json'
      - 'data/land-blocks.json'
      - 'test/background-blocks.test.mjs'
      - 'css/inv.css'
      - 'test/runtime-reliability.test.mjs'
      - 'test/drop-dialog.test.mjs'
      - 'test/inventory-filter.test.mjs'
      - '.github/workflows/planner-runtime-regression.yml'
  pull_request:
    paths:
      - 'font/**'
      - 'css/base.css'
      - 'js/preview-mode.js'
      - 'js/player-shadow.mjs'
      - 'js/pads.js'
      - 'css/preview-mode.css'
      - 'src/**'
      - 'demo/engine/**'
      - 'js/player-chat.js'
      - 'js/world-motion.mjs'
      - 'js/skin-colors*'
      - 'js/item-info.js'
      - 'js/customization.js'
      - 'css/player-chat.css'
      - 'css/customization.css'
      - 'css/item-info.css'
      - 'data/item-info.json'
      - 'test/**'
      - 'js/core.js'
      - 'js/tabs.js'
      - 'js/grid.js'
      - 'js/app.js'
      - 'js/drop.js'
      - 'js/weather.js'
      - 'js/background.js'
      - 'js/land.js'
      - 'js/land-system.mjs'
      - 'js/blackbox.js'
      - 'js/drop-world.mjs'
      - 'css/blackbox.css'
      - 'css/dropdowns.css'
      - 'index.html'
      - 'data/blocks.json'
      - 'data/land-blocks.json'
      - 'test/background-blocks.test.mjs'
      - 'css/inv.css'
      - 'test/runtime-reliability.test.mjs'
      - 'test/drop-dialog.test.mjs'
      - 'test/inventory-filter.test.mjs'
      - '.github/workflows/planner-runtime-regression.yml'
jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
